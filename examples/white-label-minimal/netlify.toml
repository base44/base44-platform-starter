# Separate Netlify project: leave Base directory at repository root and set
# Package directory to examples/white-label-minimal in Netlify's build settings.
# This overrides Sunny's root build command, which runs database migrations.
[build]
  command = "npm run minimal:build"
  publish = "examples/white-label-minimal/.next"

[build.environment]
  NODE_VERSION = "24"
  # When this example's @base44/platform range leaves the root's, npm installs it
  # under the example's own node_modules, which the secrets scanner would
  # otherwise read. Installed packages are never served.
  SECRETS_SCAN_OMIT_PATHS = "examples/white-label-minimal/node_modules/**"
