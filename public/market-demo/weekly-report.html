<!doctype html><meta charset="utf-8"><title>Weekly report</title>
<link rel="stylesheet" href="/market-demo/style.css">
<h1>Weekly report</h1>
<p class="sub">Where your work sits, by board.</p>
<div id="out" class="empty">Loading…</div>
<p id="err" class="err"></p>
<script src="/market-demo/sunny-sdk.js"></script>
<script>
const el = (id) => document.getElementById(id);

(async () => {
  try {
    const { boards } = await Sunny.call("listBoards", { limit: 20 });
    if (!boards.length) return (el("out").textContent = "No boards yet.");

    // getBoard, not listBoards, for the columns: the list endpoint returns them
    // but the single-board read is the documented source of truth for the shape.
    const rows = await Promise.all(boards.map(async (b) => {
      const { items } = await Sunny.call("listItems", { board_id: b.id, limit: 500 });
      const { board } = await Sunny.call("getBoard", { board_id: b.id });
      // `data` is keyed by column id, never by column title — item.data.status is
      // always wrong. Find the status column first, then index by its id.
      const statusCol = (board.columns || []).find((c) => c.type === "status");
      const done = statusCol
        ? items.filter((i) => /done|complete/i.test(String(i.data?.[statusCol.id] ?? ""))).length
        : 0;
      return { title: b.title, total: items.length, done };
    }));

    const total = rows.reduce((n, r) => n + r.total, 0);
    const done = rows.reduce((n, r) => n + r.done, 0);
    el("out").className = "";
    el("out").innerHTML =
      `<p class="big">${total}<span class="n" style="font-size:13px"> items · ${done} done</span></p>` +
      "<ul>" + rows.map((r) =>
        `<li><span>${r.title}</span><span class="n">${r.done}/${r.total}</span></li>`).join("") + "</ul>";
  } catch (e) {
    el("out").textContent = "";
    el("err").textContent = Sunny.explain(e);
  }
})();
</script>
