<!doctype html><meta charset="utf-8"><title>Quick capture</title>
<link rel="stylesheet" href="/market-demo/style.css">
<h1>Quick capture</h1>
<p class="sub">Drop a task on a board without leaving the page.</p>
<div class="row">
  <select id="board"><option>Loading…</option></select>
</div>
<div class="row" style="margin-top:8px">
  <input id="title" placeholder="What needs doing?" disabled>
  <button id="add" class="primary" disabled>Add</button>
</div>
<p id="err" class="err"></p>
<p id="ok" class="err ok"></p>
<ul id="recent"></ul>
<script src="/market-demo/sunny-sdk.js"></script>
<script>
const el = (id) => document.getElementById(id);
const added = [];

(async () => {
  try {
    const { boards } = await Sunny.call("listBoards", { limit: 20 });
    if (!boards.length) {
      el("board").innerHTML = "<option>No boards</option>";
      return;
    }
    el("board").innerHTML = boards.map((b) => `<option value="${b.id}">${b.title}</option>`).join("");
    el("title").disabled = false;
    el("add").disabled = false;
  } catch (e) {
    el("err").textContent = Sunny.explain(e);
  }
})();

async function add() {
  const title = el("title").value.trim();
  if (!title) return;
  el("err").textContent = "";
  el("ok").textContent = "";
  el("add").disabled = true;
  try {
    // Drop it in the board's first group, which is where a person would expect a
    // captured task to land. groups[] lives on the board, not on the item.
    const { board } = await Sunny.call("getBoard", { board_id: el("board").value });
    const { item } = await Sunny.call("createItem", {
      board_id: board.id,
      group_id: board.groups?.[0]?.id,
      title,
    });
    added.unshift(item.title);
    el("recent").innerHTML = added.slice(0, 5).map((t) => `<li><span>${t}</span><span class="n">added</span></li>`).join("");
    el("title").value = "";
    el("ok").textContent = "Added to " + board.title;
  } catch (e) {
    el("err").textContent = Sunny.explain(e);
  } finally {
    el("add").disabled = false;
  }
}

el("add").onclick = add;
el("title").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
</script>
