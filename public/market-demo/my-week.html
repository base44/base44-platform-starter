<!doctype html><meta charset="utf-8"><title>My week</title>
<link rel="stylesheet" href="/market-demo/style.css">
<h1>My week</h1>
<p class="sub">Everything with a date in the next seven days.</p>
<div id="out" class="empty">Loading…</div>
<p id="err" class="err"></p>
<script src="/market-demo/sunny-sdk.js"></script>
<script>
const el = (id) => document.getElementById(id);
const DAY = 86400000;

/** Any date-typed column on the board — apps must not assume a field called "due". */
function dateColumns(board) {
  return (board.columns || []).filter((c) => c.type === "date").map((c) => c.id);
}

(async () => {
  try {
    const { boards } = await Sunny.call("listBoards", { limit: 20 });
    const now = Date.now();
    const soon = [];

    for (const b of boards) {
      const { board } = await Sunny.call("getBoard", { board_id: b.id });
      const cols = dateColumns(board);
      if (!cols.length) continue;
      const { items } = await Sunny.call("listItems", { board_id: b.id, limit: 500 });
      for (const item of items) {
        for (const col of cols) {
          const raw = item.data?.[col];
          const when = raw ? Date.parse(raw) : NaN;
          if (!Number.isNaN(when) && when >= now - DAY && when <= now + 7 * DAY) {
            soon.push({ title: item.title, board: b.title, when });
            break;
          }
        }
      }
    }

    soon.sort((a, b) => a.when - b.when);
    el("out").className = soon.length ? "" : "empty";
    el("out").innerHTML = soon.length
      ? "<ul>" + soon.map((i) =>
          `<li><span>${i.title}<br><span class="n" style="font-size:11px">${i.board}</span></span>` +
          `<span class="n">${new Date(i.when).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}</span></li>`
        ).join("") + "</ul>"
      : "Nothing dated in the next seven days.";
  } catch (e) {
    el("out").textContent = "";
    el("err").textContent = Sunny.explain(e);
  }
})();
</script>
